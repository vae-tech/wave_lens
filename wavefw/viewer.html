<!doctype html>

<head>

<title>Wave viewer</title>
<!-- wavefw/viewer.html — an empty viewer: Open… a VCD (or drop it on the viewer), ⟳ reads it again from the disk.
     No build step: open this file from the repository (file://); the framework files are its neighbours. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="wavefw.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>Wave viewer</h1>
<p>Drop a VCD on the viewer, or Open… in its bar (the last line); ⟳ reads it again after a new simulation, the view kept. An FST: <code>sva vcd x.fst --out x.vcd</code> (the CLI in <code>bin/</code>; or GTKWave's <code>fst2vcd x.fst &gt; x.vcd</code>), or <code>make html WAVES=x.fst</code>.</p>
<script type="application/wavedrom" data-title="no dump yet">
{ "signal": [{ "name": "drop a VCD here", "wave": "x..." }], "head": { "text": "no dump yet · Open… or drop a VCD" } }
</script>
<script src="wavefw.config.js"></script>
<script src="wavefw.js"></script>
<script src="sva.wasm.js"></script>
<script src="bus.js"></script>
<script src="sva.js"></script>
</body>
</html>
